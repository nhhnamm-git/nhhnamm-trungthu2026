<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nhhnamm - Trung Thu</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css.css">
</head>
<body>

    <div id="webgl-container"></div>

    <div class="top-bar">
        <button class="icon-btn" id="audio-btn" title="Bật/Tắt Nhạc"><i class="fas fa-music"></i></button>
        <button class="icon-btn" id="reset-cam-btn" title="Góc nhìn ban đầu"><i class="fas fa-compress-arrows-alt"></i></button>
    </div>

    <div class="click-hint"></div>

    <div class="wish-modal" id="wishModal">
        <div class="wish-card">
            <button class="close-btn" id="closeWishBtn" aria-label="Đóng"><i class="fas fa-times"></i></button>
            <h3 id="wishTitle">Trung thu - Tết đoàn viên</h3>

            <div class="wish-image-container">
                <img id="wishImage" src="" alt="Hình ảnh Trung Thu">
            </div>

            <p id="wishText">"Ước cho những điều bạn mong chờ sẽ thành hiện thực dưới ánh trăng rằm tháng Tám."</p>
            <div class="tag">✦ Trung Thu Đoàn Viên ✦</div>
        </div>
    </div>

    <audio id="bgm" loop src="./1.mp3"></audio>

    <!-- Three.js & OrbitControls -->
    <script src="./three.min.js"></script>
    <script src="./OrbitControls.js"></script>
    <script src="./script.js"></script>
</body>
</html>
